{{ define "main" }}
<div class="boxed">
  {{- with .Site.Params.author.name }}
  <h1 class="about-title">{{ . }}</h1>
  {{- end }}
  {{- with .Site.Params.author.avatar }}
  <figure class="about-avatar">
    <img class="avatar" src="{{ . }}" alt="Game Boy-style pixel-art portrait of GoatFoo with contact details">
    <figcaption class="visually-hidden">
      <ul class="content-list">
        {{- range $.Site.Params.author.contacts }}
        <li>{{ .service }}: {{ .address }}</li>
        {{- end }}
      </ul>
    </figcaption>
  </figure>
  {{- end }}
</div>
{{ end }}
